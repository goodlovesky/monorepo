name: Desktop Linux x64

on:
  workflow_dispatch:
  push:
    branches: [feature/mihomo-desktop]
    paths:
      - "app/**"
      - "cmd/**"
      - "tools/build_linux.sh"
      - "tools/download_mihomo_linux.sh"
      - ".github/workflows/desktop-linux.yml"

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libcap2-bin dpkg-dev curl

      - name: Analyze and test Linux contracts
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test \
            test/linux_network_service_test.dart \
            test/cross_platform_packaging_contract_test.dart \
            test/desktop_runtime_test.dart \
            test/profile_repository_test.dart

      - name: Build Linux packages
        run: ./cmd/build-linux.sh --clean --skip-tests

      - name: Verify Linux packages
        run: |
          version="$(awk '/^version:/{split($2,v,"+"); print v[1]; exit}' app/pubspec.yaml)"
          test -s "dist/linux/ClashRS-$version-linux-x64.tar.gz"
          test -s "dist/linux/clash-rs_${version}_amd64.deb"
          test -s dist/linux/BUILD-MANIFEST.json
          test -s dist/linux/SHA256.txt
          tar -tzf "dist/linux/ClashRS-$version-linux-x64.tar.gz" | grep -q './clash_rs'
          tar -tzf "dist/linux/ClashRS-$version-linux-x64.tar.gz" | grep -q './mihomo'
          dpkg-deb --contents "dist/linux/clash-rs_${version}_amd64.deb" | grep -q 'opt/clash-rs/clash_rs'
          (cd dist/linux && sha256sum --check SHA256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Clash-RS-Linux-x64
          path: |
            dist/linux/ClashRS-*-linux-x64.tar.gz
            dist/linux/clash-rs_*_amd64.deb
            dist/linux/SHA256.txt
            dist/linux/BUILD-MANIFEST.json
            dist/linux/BUILD-ENVIRONMENT.txt
          if-no-files-found: error
          retention-days: 14
