[workspace]
resolver = "2"
members = [
    "crates/core-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
authors = ["yukee <yukeeokko@gmail.com>"]
repository = "https://github.com/goodlovesky/monorepo"

[workspace.dependencies]
# 核心代理引擎
clash-rs = { git = "https://github.com/Watfaq/clash-rs", tag = "v0.10.7" }
clash-lib = { git = "https://github.com/Watfaq/clash-rs", tag = "v0.10.7" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# FFI
libc = "0.2"
cbindgen = "1"

# 工具
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
