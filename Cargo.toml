[workspace]
resolver = "2"
members = [
    "crates/core-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-or-later"
authors = ["yukee <yukeeokko@gmail.com>"]
repository = "https://github.com/goodlovesky/monorepo"

[workspace.dependencies]
# 核心代理引擎
# 0.8.2 是最后一个在 stable Rust + 老版 russh 上能编译的版本
# 0.9.x 用了 russh 0.60（pkcs5 API 变化导致编译失败）
# 0.10.x 依赖 nightly + 新的 rustls API，目前还不稳定
# default-features = false: 关掉默认的 aws-lc-rs
clash-rs = { git = "https://github.com/Watfaq/clash-rs", tag = "v0.8.2", default-features = false }
clash-lib = { git = "https://github.com/Watfaq/clash-rs", tag = "v0.8.2", default-features = false }

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# FFI
libc = "0.2"
cbindgen = "1"

# 工具
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
