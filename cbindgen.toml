# cbindgen 配置 - 用于生成 C 头文件给 Flutter 端
# 用法: cbindgen --config cbindgen.toml --crate core-bridge --output bindings/core_bridge.h /path/to/core-bridge

language = "C"
autogen_warning = "/* This file is auto-generated by cbindgen, do not modify. */"
cpp_compat = true
documentation = true
tab_width = 4
include_version = true
include_guard = "CORE_BRIDGE_H"
line_endings = "LF"

[export]
include = ["ErrorCode"]
item_types = ["enums", "typedefs", "functions", "constants"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true
