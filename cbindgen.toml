# cbindgen 配置 - 用于生成 C 头文件给 Flutter 端
# 用法: cbindgen --config cbindgen.toml --crate core-bridge --output bindings/core_bridge.h

language = "C"
autogen_warning = "/* This file is auto-generated by cbindgen, do not modify. */"
cpp_compat = true
documentation = true
tab_width = 4
include_version = true
include_guard = "CORE_BRIDGE_H"
namespaces = []
line_endings = "LF"

[export]
include = ["ErrorCode"]
exclude = []
prefix = ""
item_types = ["enums", "structs", "typedefs", "functions", "constants"]
renaming_overrides_prefix = ""

[parse]
parse_deps = true
include = []
exclude = []
expand = ["core-bridge"]

[fn]
rename_args = "GeckoCase"
sort_by = "Name"
args_preprocessor_typedef = true

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
enum_class = false

[struct]
rename_fields = "GeckoCase"
tagged_fields = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false

[macro]
generics = false
