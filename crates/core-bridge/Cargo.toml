[package]
name = "core-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FFI bridge exposing the clash-rs proxy core to Dart/Flutter"

[lib]
name = "core_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

# clash-rs-helper 已拆到 crates/clash-rs-helper 独立 crate,这里不再 [[bin]]。

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[dependencies]
# FFI 必需
libc = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 异步运行时
tokio = { workspace = true, optional = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

# clash-rs 核心（Phase 0.3 集成）
# 使用 0.9.7 以支持订阅中的 VLESS + Reality；关闭本节点不需要且与
# 当前 shadowsocks 依赖 API 不兼容的 shadowsocks 功能。
clash-lib = { workspace = true, default-features = false, features = ["zero_copy", "tun", "tproxy", "ring"] }

[features]
default = ["dep:tokio", "dep:tracing-subscriber"]
# Phase 0.2 demo 模式（不启用 clash-lib）: cargo build --no-default-features
demo = []

[dev-dependencies]
# 测试
tempfile = "3"
