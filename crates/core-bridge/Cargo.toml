[package]
name = "core-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FFI bridge exposing the clash-rs proxy core to Dart/Flutter"

[lib]
name = "core_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[dependencies]
# FFI 必需
libc = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 异步运行时
tokio = { workspace = true, optional = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

# clash-rs 核心（Phase 0.3 集成）
# 用 0.8.2 不用 0.9.x/0.10.x：旧版 russh 跟老 pkcs5 兼容
# 0.9.x russh 0.60 + pkcs5 0.8 API 不兼容
# 0.10.x 依赖 nightly + 新 rustls API
# 砍掉了 ssh/tuic/wireguard/shadowquic 这些协议，先跑通链路
clash-lib = { workspace = true, default-features = false, features = ["shadowsocks", "zero_copy", "tun", "tproxy", "ring"] }

[features]
default = ["dep:tokio", "dep:tracing-subscriber"]
# Phase 0.2 demo 模式（不启用 clash-lib）: cargo build --no-default-features
demo = []

[dev-dependencies]
# 测试
tempfile = "3"
